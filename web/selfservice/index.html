<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Trading — Self-Service</title>

<link rel="stylesheet" href="../shared.css">
<link rel="icon" type="image/x-icon" href="../logo.ico">
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
<script src="../shared.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<!-- We keep this hidden initially, it gets moved INTO the header's Wallet panel -->
<div id="customWalletUI" style="display:none;">
  <div id="accountsTableWrap" style="margin-top:16px; margin-bottom:16px;">
    <div id="accountsList" class="acct-list">
      <div class="muted">No accounts connected.</div>
    </div>
  </div>
  <div style="background: #14161b; padding: 12px 16px; border-radius: 6px; border: 1px solid #22262f;">
    <label style="font-size:12px; color:#aaa; display:block; margin-bottom:8px;">Approve Stablecoin Allowance (in tokens, blank = unlimited)</label>
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="text" id="approveAmount" placeholder="e.g. 1000, or leave blank" style="max-width:250px;">
      <button onclick="approveMarket()" style="margin:0;">Approve</button>
    </div>
    <div id="approveLog" class="log"></div>
  </div>
</div>

<script>
  fetch("../header.html")
    .then(r => r.text())
    .then(html => { 
        $("header-placeholder").outerHTML = html; 
        
        // Hijack the generic Wallet panel from the header!
        const rolesWrap = $("rolesTableWrap");
        const customUI = $("customWalletUI");
        if (rolesWrap && customUI) {
            // Hide the default Admin roles table
            rolesWrap.style.display = "none";
            // Insert our custom Selection/Balance UI exactly where the roles table was
            customUI.style.display = "block";
            rolesWrap.parentNode.insertBefore(customUI, rolesWrap.nextSibling);
        }
        
        initGlobal(); 
    })
    .catch(e => console.error("Failed to load header.html:", e));
</script>

<script>
// Override shared.js's generic renderRolesTable function.
// Instead of drawing the Admin-centric roles, we trigger our own data fetch.
window.renderRolesTable = function(rows) {
  refreshAccountsData();
};

window.addEventListener('marketConfigLoaded', async () => {
  if (window._accounts && window._accounts.length) await refreshAccountsData();
});

let selectedApproveAccount = null;

if (window.ethereum) {
  window.ethereum.on("accountsChanged", async (accounts) => {
    if (accounts.length) {
      if (selectedApproveAccount && !accounts.find(a => a.toLowerCase() === selectedApproveAccount)) {
        selectedApproveAccount = accounts[0].toLowerCase();
      }
      // Note: shared.js handles calling renderRolesTable (our override) on accountsChanged automatically
    } else { 
      window._approveAccountData = null; 
      selectedApproveAccount = null;
      updateApproveKv(); 
    }
  });
}

const MAX_UINT256 = (2n ** 256n - 1n).toString();

// Cached under its own key (not shared.js's window._perAccountData, which
// holds role-table data) so the two don't clobber each other when both
// refresh off the same accountsChanged event.
async function refreshAccountsData() {
  if (!window._accounts || window._accounts.length === 0 || !cfg.stablecoin) return;
  const stablecoinR = new readWeb3.eth.Contract(ERC20_ABI, cfg.stablecoin);

  if (window._decimals === undefined) {
    try {
      window._decimals = Number(await stablecoinR.methods.decimals().call());
      window._symbol = await stablecoinR.methods.symbol().call();
    } catch (e) {
      console.warn("Could not load decimals/symbol:", e.message);
    }
  }

  const perAccount = await Promise.all(window._accounts.map(async (acct) => {
    let balance = null, allowance = null;
    try { balance = await stablecoinR.methods.balanceOf(acct).call(); } catch (e) {}
    try { allowance = await stablecoinR.methods.allowance(acct, cfg.market).call(); } catch (e) {}
    return { address: acct, balance, allowance };
  }));

  window._approveAccountData = perAccount;
  updateApproveKv();
}

function updateApproveKv() {
  const rows = window._approveAccountData;
  const list = $("accountsList");

  if (!rows || rows.length === 0) {
    list.innerHTML = "<div class='muted'>No accounts connected.</div>";
    return;
  }

  // Automatically select the first account by default
  if (!selectedApproveAccount && window._accounts && window._accounts.length > 0) {
    selectedApproveAccount = window._accounts[0].toLowerCase();
  }

  const decimals = window._decimals;
  const symbol = window._symbol || "";

  list.innerHTML = rows.map(r => {
    const isSelected = selectedApproveAccount === r.address.toLowerCase();
    const isActive = r.address.toLowerCase() === window._accounts[0].toLowerCase();

    const balStr = (r.balance !== null && decimals != null) ? fmtToken(r.balance, decimals) + " " + symbol : "?";
    const allStr = (r.allowance !== null && decimals != null) ? fmtAllowance(r.allowance, decimals, symbol) : "?";

    return `
      <label class="acct-row${isSelected ? " selected" : ""}" title="${r.address}">
        <input type="radio" class="acct-radio-input" name="accountSelect" value="${r.address}"
               ${isSelected ? "checked" : ""} onchange="selectAccount('${r.address}')">
        <span class="acct-radio-visual"><span class="dot"></span></span>
        <span class="acct-main">
        <span class="acct-addr">${short(r.address)}</span>
          <span class="acct-sub">Balance ${balStr}</span>
        </span>
        <span class="acct-allowance">
          <span class="acct-allowance-label">Allowance</span>
          <span class="acct-allowance-value">${allStr}</span>
        </span>
      </label>`;
  }).join("");
}

function selectAccount(addr) {
  selectedApproveAccount = addr.toLowerCase();
  updateApproveKv(); // Re-render the table to instantly apply the green selection style
}

function fmtToken(raw, decimals) {
  return (Number(BigInt(raw)) / 10 ** Number(decimals)).toString();
}

function fmtAllowance(raw, decimals, symbol) {
  if (raw === MAX_UINT256) return "Unlimited";
  return fmtToken(raw, decimals) + " " + symbol;
}

function toTokenUnits(amountStr, decimals) {
  amountStr = amountStr.trim();
  const [whole, frac = ""] = amountStr.split(".");
  const fracPadded = (frac + "0".repeat(decimals)).slice(0, decimals);
  const wholeDigits = whole === "" ? "0" : whole;
  return BigInt(wholeDigits) * (10n ** BigInt(decimals)) + BigInt(fracPadded || "0");
}

async function approveMarket() {
  if (!selectedApproveAccount) { alert("Please connect and select a wallet first."); return; }
  if (!window.stablecoinW) { alert("Stablecoin address not loaded yet."); return; }
  $("approveLog").innerHTML = "";

  const amountRaw = $("approveAmount").value.trim();
  let amountUnits;
  try {
    if (amountRaw === "") {
      amountUnits = MAX_UINT256;
      log("approveLog", "No amount given -> unlimited approve.", "step-info");
    } else {
      const decimals = window._decimals ?? 6;
      amountUnits = toTokenUnits(amountRaw, decimals).toString();
      log("approveLog", `Amount: ${amountRaw} ${window._symbol || ""} (${amountUnits} smallest units)`, "step-info");
    }

    log("approveLog", `Sending approve() from ${short(selectedApproveAccount)} ...`, "step-info");
    await sendTx(window.stablecoinW.methods.approve(cfg.market, amountUnits), selectedApproveAccount);
    log("approveLog", "✓ Done.", "step-ok");
    await refreshAccountsData();
  } catch (e) {
    log("approveLog", `✗ Failed: ${e.message}`, "step-bad");
  }
}
</script>

</body>
</html>
